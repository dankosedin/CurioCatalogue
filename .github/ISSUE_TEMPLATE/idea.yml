name: Idea
description: Something the mod could do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        `ROADMAP.md` lists the ideas we already have; `DESIGN.md` says what the mod is for and what it will not do.
  - type: textarea
    id: what
    attributes:
      label: What and why
      description: What you would like to do in game, and why. The player's view helps more than the implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How you manage today
      description: What you do now instead: other mods, vanilla, a workaround.
