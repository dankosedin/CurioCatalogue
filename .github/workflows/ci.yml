# Runs the core tests, then builds the solution against the game and runs both test projects (docs/development.md,
# Branches, PRs and releases).
name: CI

on:
  push:
    branches: [main, release, "feature/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The projects take the game DLLs from here; nothing of the game is committed.
      VINTAGE_STORY: ${{ github.workspace }}/game
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The core needs no game: its tests fail fast, before the download (docs/architecture.md, Part 1).
      - name: Core tests
        run: dotnet test CurioCatalogue.Core.Tests

      - name: Game version from modinfo.json
        id: game
        run: echo "version=$(jq -r '.dependencies.game' curiocatalogue/modinfo.json)" >> "$GITHUB_OUTPUT"

      - name: Cache the game
        id: cache
        uses: actions/cache@v6
        with:
          path: game
          key: vs-server-linux-${{ steps.game.outputs.version }}

      # The dedicated server archive has every DLL we reference (VintagestoryAPI, VSSurvivalMod, VSEssentials,
      # Lib/protobuf-net, Lib/Newtonsoft.Json) and needs no account. URL and md5 come from the game's release index.
      - name: Download the game
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.game.outputs.version }}
        run: |
          entry=$(curl -sSfL https://api.vintagestory.at/stable.json | jq -e --arg v "$VERSION" '.[$v].linuxserver')
          curl -sSfL -o server.tar.gz "$(jq -r '.urls.cdn' <<< "$entry")"
          echo "$(jq -r '.md5' <<< "$entry")  server.tar.gz" | md5sum -c -
          mkdir -p game
          tar -xzf server.tar.gz -C game
          rm server.tar.gz

      - name: Build
        run: dotnet build curiocatalogue.sln

      - name: Test
        run: dotnet test curiocatalogue.sln --no-build

  # A push to `release` publishes the version in modinfo.json: the zip, the tag and a GitHub Release whose notes are that
  # version's section of CHANGELOG.md (docs/development.md, Branches, PRs and releases).
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VINTAGE_STORY: ${{ github.workspace }}/game
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version from modinfo.json
        id: mod
        run: |
          {
            echo "version=$(jq -r '.version' curiocatalogue/modinfo.json)"
            echo "name=$(jq -r '.name' curiocatalogue/modinfo.json)"
            echo "modid=$(jq -r '.modid' curiocatalogue/modinfo.json)"
            echo "game=$(jq -r '.dependencies.game' curiocatalogue/modinfo.json)"
          } >> "$GITHUB_OUTPUT"

      # Checked before the build, so a forgotten version bump or changelog fails in seconds.
      - name: The tag is new
        env:
          VERSION: ${{ steps.mod.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION exists: bump the version in modinfo.json"
            exit 1
          fi

      # The section starts at "## X.Y.Z (date)" and ends before the next "## ". Its heading must carry the date.
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.mod.outputs.version }}
        run: |
          heading=$(grep -m1 -E "^## ${VERSION//./\\.}( |$)" CHANGELOG.md) || {
            echo "::error::CHANGELOG.md has no section \"## $VERSION\""
            exit 1
          }
          case "$heading" in
            *unreleased*) echo "::error::CHANGELOG.md: \"$heading\" is not dated"; exit 1 ;;
          esac
          awk -v h="$heading" 'f && /^## / { exit } f { print } $0 == h { f = 1 }' CHANGELOG.md | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md: the section \"$heading\" is empty"
            exit 1
          fi

      # The build job of this run has just filled or used this cache.
      - name: Restore the game
        uses: actions/cache/restore@v6
        with:
          path: game
          key: vs-server-linux-${{ steps.mod.outputs.game }}
          fail-on-cache-miss: true

      - name: Release zip (CakeBuild)
        run: dotnet run --project CakeBuild/CakeBuild.csproj

      - name: Tag and GitHub Release
        env:
          VERSION: ${{ steps.mod.outputs.version }}
          NAME: ${{ steps.mod.outputs.name }}
          MODID: ${{ steps.mod.outputs.modid }}
        run: |
          gh release create "v$VERSION" "Releases/${MODID}_$VERSION.zip" \
            --target "$GITHUB_SHA" --title "$NAME $VERSION" --notes-file notes.md
